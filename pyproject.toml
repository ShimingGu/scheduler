[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-revision-scheduler"
version = "0.3.0"
description = "Unattended serial execution with API-driven revision of future steps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
serial-scheduler = "scheduler.__main__:main"

[tool.setuptools]
packages = ["scheduler"]
package-dir = {scheduler = "."}

[tool.setuptools.package-data]
scheduler = ["ui.html", "examples/worker.py", "examples/plan.json", "examples/scheduler.ini", "examples/slurm.sh"]
