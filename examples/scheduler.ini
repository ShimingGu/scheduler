; Paths are relative to this INI file. The key stays in the user's own file.
[scheduler]
plan = plan.json
run_dir = ../runs/example
autonomy = faithful

[api]
key_file = /absolute/path/to/your/api-key.env
base_url = https://api.deepseek.com/v1
model = deepseek-flash
reasoning_effort = default
timeout = 120
max_tokens = 4096
